<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rebecca Parsons</title>
  <meta property="og:title" content="Rebecca Parsons">
  <meta property="og:description" content="song weaver, harmony gardener, sound rotator">
  <meta property="og:image" content="https://rmpars.com/static/simran.png">
  <meta property="og:url" content="https://rmpars.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="back">&larr; home</a>
    <main>
      <h1>conducting</h1>
    </main>
  </div>
  <div class="gif-carousel">
    <div class="gif-track">
      <div class="gif-slide active">
        <img src="static/simran.png" alt="A beautiful painting of Rebecca conducting" style="width:380px;border-radius:6px">
        <p class="small">Painting by my friend <a href="https://www.simrangleason.com/" target="_blank">Simran Gleason</a>, 2026 concert with Aurora Chorus.</p>
      </div>
      <div class="gif-slide">
        <a href="https://youtu.be/alS5LuVhSNw?si=XxTCN1UrbD-YwbJ8&t=216" target="_blank" rel="noopener">
          <img src="hallelujah.gif" alt="" style="width:380px;border-radius:6px">
        </a>
        <p class="small">Selections from Handel's Messiah, 2025</p>
      </div>
      <div class="gif-slide">
        <a href="https://youtu.be/k2_2DT_cbRw" target="_blank" rel="noopener">
          <img src="moongoddess.gif" alt="" style="width:380px;border-radius:6px">
        </a>
        <p class="small">Moon Goddess by Jocelyn Hagen, 2024</p>
      </div>
    </div>
    <div class="gif-dots">
      <span class="gif-dot active"></span>
      <span class="gif-dot"></span>
      <span class="gif-dot"></span>
    </div>
  </div>
<script>
(() => {
  const carousel = document.querySelector('.gif-carousel');
  const slides = [...carousel.querySelectorAll('.gif-slide')];
  const dots = [...carousel.querySelectorAll('.gif-dot')];
  let current = 0;
  let startX = 0;

  function show(idx) {
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');
    current = idx;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
  }

  carousel.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
  carousel.addEventListener('touchend', e => {
    const diff = e.changedTouches[0].clientX - startX;
    if (Math.abs(diff) > 40) {
      if (diff < 0 && current < slides.length - 1) show(current + 1);
      else if (diff > 0 && current > 0) show(current - 1);
    }
  });

  // click/drag for desktop
  let mouseDown = false, mouseX = 0;
  carousel.addEventListener('mousedown', e => { mouseDown = true; mouseX = e.clientX; });
  carousel.addEventListener('mouseup', e => {
    if (!mouseDown) return;
    mouseDown = false;
    const diff = e.clientX - mouseX;
    if (Math.abs(diff) > 40) {
      if (diff < 0 && current < slides.length - 1) show(current + 1);
      else if (diff > 0 && current > 0) show(current - 1);
    }
  });

  dots.forEach((dot, i) => dot.addEventListener('click', () => show(i)));
})();
</script>
</body>
</html>
