<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rebecca Parsons</title>
  <meta property="og:title" content="Rebecca Parsons">
  <meta property="og:description" content="song weaver, harmony gardener, sound rotator">
  <meta property="og:image" content="https://rmpars.com/static/simran.png">
  <meta property="og:url" content="https://rmpars.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <a href="index.html" class="back">&larr; home</a>
    <main>
      <h1>contact</h1>
      <form action="https://formspree.io/f/mvzevoeg" method="POST" class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <button type="submit" id="send-btn">Send</button>
      </form>
    </main>
  </div>
<script>
function sparkle(el) {
  const rect = el.getBoundingClientRect();
  const chars = ['✦', '✧', '⋆', '˚', '✶'];
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('span');
    s.textContent = chars[Math.floor(Math.random() * chars.length)];
    s.style.cssText = `
      position:fixed;
      left:${rect.left + Math.random() * rect.width}px;
      top:${rect.top + Math.random() * rect.height}px;
      pointer-events:none;
      font-size:${10 + Math.random() * 14}px;
      color:var(--accent);
      z-index:999;
      animation:sparkle-fly 0.7s ease-out forwards;
    `;
    s.style.setProperty('--dx', `${(Math.random() - 0.5) * 80}px`);
    s.style.setProperty('--dy', `${-30 - Math.random() * 50}px`);
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}

document.getElementById('send-btn').addEventListener('click', function() {
  sparkle(this);
});
</script>
</body>
</html>
